site_name: Yanez Biometrics Partner Integration
site_description: Public integration documentation for partners building with Yanez Biometrics.
site_url: https://docs.yanez.ai/apidocs/
site_dir: site/apidocs
repo_url: https://github.com/yanez-compliance/yanez-yid-partner-docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: slate
      primary: black
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Overview: overview.md
  - Onboarding: onboarding.md
  - Core Concepts: concepts.md
  - Authentication: authentication.md
  - Deep Link Signing: deep-link-signing.md
  - Callback Verification: callback.md
  - Backend API:
      - API Reference: api/backend-api.md
      - Errors: api/errors.md
  - Platform Guides:
      - Web Apps: platforms/web.md
      - Android Apps: platforms/android.md
      - iPhone Apps: platforms/ios.md
  - Testing: testing.md
  - Privacy and Security: privacy-security.md
  - Production Checklist: production-checklist.md
  - Glossary: glossary.md
